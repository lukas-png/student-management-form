[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tutorium-planer"
version = "0.1.0"
description = "Plan and track homework presentations in tutorials: filtering, magic-link availability collection, slot assignment, mail, and attendance tracking."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lukas-png" }]
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "jinja2==3.1.6",
    "sqlmodel==0.0.38",
    "pydantic-settings==2.14.1",
    "itsdangerous==2.2.0",
    "openpyxl==3.1.5",
    "python-multipart==0.0.31",
    "httpx==0.28.1",
    "slowapi==0.1.9",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.15.15",
    "mypy==2.1.0",
    "types-openpyxl==3.1.5.20260518",
]

[project.scripts]
planer = "planer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/planer"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/planer/web/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sqlmodel.*", "slowapi.*", "itsdangerous.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/planer"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
