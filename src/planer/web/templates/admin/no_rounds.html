{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Tutorium-Planer Admin</h1>
  <p>Noch keine Planungsrunde vorhanden.</p>
  <form method="post" action="/admin/rounds" class="toolbar">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Label: <input name="label" type="text"></label>
    <button type="submit" class="btn-primary">Runde erstellen</button>
  </form>
</div>
{% endblock %}
